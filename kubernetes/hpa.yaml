
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fifa-h2h-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fifa-h2h
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

